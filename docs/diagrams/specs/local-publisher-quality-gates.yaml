title: Local Publisher Deterministic Quality Gates
direction: LR
graph_attr:
  ranksep: "0.95"
  nodesep: "0.5"
  pad: "0.5"
clusters:
  - id: source
    label: Source identity and in-flight state
    graph_attr:
      bgcolor: "#eff6ff"
      color: "#2563eb"
  - id: evidence
    label: Evidence-faithful single-pass plan
    graph_attr:
      bgcolor: "#f5f3ff"
      color: "#7c3aed"
  - id: repo
    label: Rendered Markdown and repository safety
    graph_attr:
      bgcolor: "#f0fdf4"
      color: "#15803d"
nodes:
  - id: packet
    label: "Packet gate\nnot CAPTCHA/error; sufficient article text"
    cluster: source
  - id: identity
    label: "Identity gate\nDOI, title, and citation metadata agree"
    cluster: source
  - id: duplicate
    label: "Duplicate gate\nbase content + paper state + open PR heads\nexplicit A/B bypass is audited"
    cluster: source
  - id: lock
    label: "Concurrency gate\none publisher owns the model slot"
    cluster: source
  - id: match
    label: "Domain/entity gate\ncompatible page or safe new path"
    cluster: evidence
  - id: quotes
    label: "Exact/near-verbatim gate\neach bullet grounded in this article"
    cluster: evidence
  - id: claims
    label: "Evidence gate\ndirect/background origin, species, scope, limits"
    cluster: evidence
  - id: citations
    label: "Citation gate\none shared main-article footnote; no external refs"
    cluster: evidence
  - id: newpage
    label: "New-page gate\ndefinition lead, entity tag, category rationale"
    cluster: evidence
  - id: style
    label: "Style gate\nNatural Healing bullet and evidence structure"
    cluster: repo
  - id: render
    label: "Render gate\nfrontmatter, headings, footnote, Markdown"
    cluster: repo
  - id: git
    label: "Git scope gate\nonly intended Markdown changes"
    cluster: repo
  - id: pass
    label: "Validated output\ndry-run patch or draft PR"
    icon: onprem.vcs.Github
    cluster: repo
  - id: stop
    label: "Fail closed\nduplicate, busy, needs review, or retry"
    cluster: repo
edges:
  - from: packet
    to: identity
  - from: identity
    to: duplicate
  - from: duplicate
    to: lock
    label: pass or explicit A/B bypass
  - from: lock
    to: match
  - from: match
    to: quotes
  - from: quotes
    to: claims
  - from: claims
    to: citations
  - from: citations
    to: newpage
    label: when creating a page
  - from: citations
    to: style
    label: existing-page update
  - from: newpage
    to: style
  - from: style
    to: render
  - from: render
    to: git
  - from: git
    to: pass
  - from: packet
    to: stop
    label: any gate fails
    style: dashed
  - from: identity
    to: stop
    style: dashed
  - from: duplicate
    to: stop
    style: dashed
  - from: lock
    to: stop
    style: dashed
  - from: match
    to: stop
    style: dashed
  - from: quotes
    to: stop
    style: dashed
  - from: claims
    to: stop
    style: dashed
  - from: citations
    to: stop
    style: dashed
  - from: newpage
    to: stop
    style: dashed
  - from: render
    to: stop
    style: dashed
  - from: git
    to: stop
    style: dashed
