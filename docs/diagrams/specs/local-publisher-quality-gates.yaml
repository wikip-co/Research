title: Local Publisher Quality Gates and Fail-Closed Decisions
direction: LR
graph_attr:
  ranksep: "0.95"
  nodesep: "0.5"
  pad: "0.5"
clusters:
  - id: source
    label: Source identity and sufficiency
    graph_attr:
      bgcolor: "#eff6ff"
      color: "#2563eb"
  - id: evidence
    label: Evidence-faithful authoring
    graph_attr:
      bgcolor: "#f5f3ff"
      color: "#7c3aed"
  - id: repo
    label: Rendered Markdown and repository safety
    graph_attr:
      bgcolor: "#f0fdf4"
      color: "#15803d"
nodes:
  - id: packet
    label: "Packet gate\nnot CAPTCHA/error; meaningful abstract or text"
    cluster: source
  - id: identity
    label: "Identity gate\nDOI and title agree across sources"
    cluster: source
  - id: duplicate
    label: "Reference gate\nDOI/URL not already cited"
    cluster: source
  - id: match
    label: "Placement gate\nconfident existing Natural Healing target"
    cluster: source
  - id: quotes
    label: "Near-verbatim gate\neach bullet grounded in source quotation"
    cluster: evidence
  - id: claims
    label: "Claim-strength gate\nstudy design, species, and limits preserved"
    cluster: evidence
  - id: mode
    label: "Critic mode\nrequired (default), advisory, or off"
    cluster: evidence
  - id: placement
    label: "Placement review\nselected target Markdown + candidate metadata"
    cluster: evidence
  - id: evidencecritic
    label: "Evidence review\nsupport, scope, overclaim, limitations"
    cluster: evidence
  - id: criticvalidation
    label: "Critic evidence gate\nfixed codes, severity, exact quotes, no contradictions"
    cluster: evidence
  - id: override
    label: "Audited ad-hoc override\nhuman reason; never available to worker"
    cluster: evidence
  - id: style
    label: "Style gate\nauthoritative Natural Healing guide"
    cluster: repo
  - id: render
    label: "Render gate\nfrontmatter, headings, footnotes, Markdown"
    cluster: repo
  - id: git
    label: "Git scope gate\nonly intended content file changes"
    cluster: repo
  - id: pass
    label: "Validated output\nrequired may draft-PR; advisory/off patch only"
    icon: onprem.vcs.Github
    cluster: repo
  - id: stop
    label: "Fail closed\nrejected, duplicate, needs review, or retry"
    cluster: repo
edges:
  - from: packet
    to: identity
  - from: identity
    to: duplicate
  - from: duplicate
    to: match
  - from: match
    to: quotes
  - from: quotes
    to: claims
  - from: claims
    to: mode
  - from: mode
    to: placement
    label: required or advisory
  - from: mode
    to: evidencecritic
    label: required or advisory
  - from: placement
    to: criticvalidation
  - from: evidencecritic
    to: criticvalidation
  - from: criticvalidation
    to: style
    label: approved or advisory
  - from: criticvalidation
    to: override
    label: "required rejection + explicit human reason"
    style: dashed
  - from: override
    to: style
  - from: mode
    to: style
    label: off; manual dry-run
    style: dashed
  - from: style
    to: render
  - from: render
    to: git
  - from: git
    to: pass
  - from: packet
    to: stop
    label: any gate fails
    style: dashed
  - from: identity
    to: stop
    style: dashed
  - from: duplicate
    to: stop
    style: dashed
  - from: match
    to: stop
    style: dashed
  - from: claims
    to: stop
    style: dashed
  - from: criticvalidation
    to: stop
    style: dashed
  - from: render
    to: stop
    style: dashed
  - from: git
    to: stop
    style: dashed
