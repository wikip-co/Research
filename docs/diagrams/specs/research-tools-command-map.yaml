    to: packet
  - from: research_cmds
    to: wiki_pkg
  - from: author_cmds
    to: wiki_pkg
  - from: local_cmds
    to: wiki_pkg
  - from: local_cmds
    to: scraper_pkg
  - from: local_cmds
    to: gmail_pkg
  - from: wiki_pkg
    to: patch
  - from: media_cmds
    to: image_pkg
  - from: image_pkg
    to: media
  - from: core_pkg
    to: scraper_pkg
