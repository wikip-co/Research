# Source for the workspace-level publishing architecture diagram.
title: Wikip.co Build-Fetch CI/CD
direction: LR
canvas:
  width: 1800
  height: 900
clusters:
  - id: content
    label: "wikip-co/content"
    x: 40
    y: 80
    width: 420
    height: 740
    graph_attr:
      bgcolor: "#f2f8f2"
      color: "#7aa874"
  - id: site
    label: "wikip-co/wikip.co"
    x: 520
    y: 80
    width: 820
    height: 740
    graph_attr:
      bgcolor: "#f4f7fb"
      color: "#6d8fb3"
  - id: public
    label: "wikip-co/public"
    x: 1400
    y: 250
    width: 340
    height: 400
    graph_attr:
      bgcolor: "#fbf7ef"
      color: "#b6954d"
nodes:
  - id: content_repo
    label: "Markdown content\nstandalone repo"
    icon: onprem.github
    cluster: content
    x: 130
    y: 190
    attrs:
      color: "#2f6f44"
      fontcolor: "#2f6f44"
  - id: trigger_sites
    label: "Dispatch exact\ncontent SHA"
    icon: onprem.githubactions
    cluster: content
    x: 130
    y: 510
    attrs:
      color: "#2f6f44"
      fontcolor: "#2f6f44"
  - id: site_repo
    label: "Hexo app +\nbuild workflow"
    icon: onprem.github
    cluster: site
    x: 610
    y: 190
    attrs:
      color: "#335d8a"
      fontcolor: "#335d8a"
  - id: fetch_inputs
    label: "Fetch content SHA\n+ public branch"
    icon: onprem.githubactions
    cluster: site
    x: 980
    y: 350
    attrs:
      color: "#335d8a"
      fontcolor: "#335d8a"
  - id: hexo_build
    label: "Prepare plain files\n+ Hexo build"
    icon: onprem.githubactions
    cluster: site
    x: 720
    y: 580
    attrs:
      color: "#335d8a"
      fontcolor: "#335d8a"
  - id: public_repo
    label: "Generated site\nstandalone repo"
    icon: onprem.github
    cluster: public
    x: 1460
    y: 380
    attrs:
      color: "#8a6b20"
      fontcolor: "#8a6b20"
edges:
  - from: content_repo
    to: trigger_sites
    label: "push main"
    label_x: 240
    label_y: 420
    color: "#2f6f44"
  - from: trigger_sites
    to: fetch_inputs
    label: "repository_dispatch\ncontent_sha"
    label_x: 650
    label_y: 490
    color: "#2f6f44"
    penwidth: "2.0"
  - from: site_repo
    to: fetch_inputs
    label: "site changes"
    label_x: 890
    label_y: 280
    color: "#335d8a"
  - from: content_repo
    to: fetch_inputs
    label: "build-time checkout"
    label_x: 620
    label_y: 220
    color: "#335d8a"
    style: dashed
  - from: fetch_inputs
    to: hexo_build
    label: "plain content tree"
    label_x: 990
    label_y: 600
    color: "#335d8a"
  - from: hexo_build
    to: public_repo
    label: "sync, commit, push"
    label_x: 1240
    label_y: 620
    color: "#8a6b20"
    penwidth: "2.0"
  - from: public_repo
    to: fetch_inputs
    label: "temporary checkout"
    label_x: 1280
    label_y: 350
    color: "#8a6b20"
    style: dashed
