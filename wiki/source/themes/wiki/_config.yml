  Keywords: keywords

customize:
    logo:
        enabled: false
        width: 40
        height: 40
        url:
    highlight: monokai
    sidebar:
    category_perExpand: false
    thumbnail: false
    favicon:
    default_index_file:
    social_links:
        github:
        stack-overflow:
        codepen:
        rss:
    social_link_tooltip: false

widgets:

search:
    insight: false
    swiftype:
    baidu: false

history_control:
    enable: true

# Badges and notices based on Git-derived article dates.
freshness:
    recent_days: 7      # "New"/"Updated" badges for changes within this many days
    stale_days: 180     # Article notice when not updated for this many days

# Home page change feed.
home:
    changes: 60         # commits listed (older ones behind "Show older changes")
    changes_visible: 15 # commits shown before "Show older changes"

# Plugins
plugins:
    lightgallery: false
    justifiedgallery: false
    mathjax: false
    google_analytics:
    google_site_verification:
    baidu_analytics:
    busuanzi_count: false

