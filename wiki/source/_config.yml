title: "Research Project Wiki"
subtitle: Documentation
description: "Evidence, diagrams, decisions and operational history for the Research workspace."
keywords:
  - knowledge base
  - documentation
author: "Research Project"
language: en
timezone: "America/Los_Angeles"
url: "http://localhost:4010"
root: "/"
permalink: :post_title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: content
public_dir: ../docs/
tag_dir: tags
archive_dir: archive
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - .nojekyll
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''
index_generator:
  path: ''
  per_page: 0
  order_by: -updated
default_category: uncategorized
category_map:
tag_map:
meta_generator: false
date_format: MMMM Do YYYY, h:mm a
time_format: HH:mm:ss
updated_option: 'date'
per_page: 0
pagination_dir: page
include:
  - .nojekyll
exclude:
ignore:
theme: wiki
deploy:
markdown:
  plugins:
    - markdown-it-footnote
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: false
    typographer: false
    quotes: '“”‘’'
  anchors:
    level: 2
    collisionSuffix: ''
    permalink: false
    permalinkClass: 'header-anchor'
    permalinkSymbol: '¶'
    case: 0
    separator: '-'
