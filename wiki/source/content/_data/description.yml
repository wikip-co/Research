Documentation: >
  Durable explanations, procedures and decisions that another person or agent can reuse.
Knowledge Base: >
  A maintained collection of evidence-backed articles, organized by purpose.
Markdown: >
  Plain-text formatting used to write wiki articles, including headings, links, tables and code.
Metadata: >
  Structured article information such as title, description, status and tags.
Operations: >
  Repeatable procedures for keeping a service or documentation system working.
Sample Project: >
  A fictional project demonstrating overviews, nested categories, decisions and meeting notes.
Workflow: >
  A sequence of writing, review, validation and publication steps.
